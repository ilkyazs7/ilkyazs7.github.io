<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} — {{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.summary and page.summary != '' %}{{ page.summary | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {% if page.cover and page.cover != "" %}<meta property="og:image" content="{{ page.cover | absolute_url }}">{% endif %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <style>:root { --accent: {{ site.data.settings.accent | default: "#2600FF" }}; }</style>
  <script>
    window.SITE = {
      mediaMap: "{{ '/assets/media-map.json' | relative_url }}",
      showCargoImages: {{ site.data.settings.show_cargo_images | default: false }}
    };
  </script>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body class="layout-{{ page.layout }}{% if site.data.settings.grayscale_thumbnails %} bw-thumbs{% endif %}">
{% include header.html %}
{{ content }}
<footer class="site-footer">{{ site.data.about.footer }}</footer>
<div class="lightbox" hidden><img alt=""></div>
</body>
</html>
